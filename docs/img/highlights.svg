<g transform="translate(452 894) scale(.67)" fill="none" stroke="#5B5FA8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></g><text x="474" y="907" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" fill="#5B5FA8">data/*.json</text>
