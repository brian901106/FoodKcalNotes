<text x="452" y="984" font-size="15" fill="#5E5873">食藥署 137 筆＋國健署 22 筆營養資料，</text>
<text x="452" y="1008" font-size="15" fill="#5E5873">開箱可查，也支援匯入自己的資料庫。</text>
