<text x="76" y="872" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" letter-spacing="1" fill="#5E5873"><tspan fill="#5B5FA8" font-weight="700">07</tspan><tspan dx="10">—</tspan><tspan dx="10">烹調方式</tspan></text>
<g transform="translate(348 856)" fill="none" stroke="#5B5FA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="14" r="7"/><circle cx="9.5" cy="14" r="2.2"/><path d="M15 9l6-5.5"/></g>
<g transform="translate(76 894) scale(.67)" fill="none" stroke="#5B5FA8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></g><text x="98" y="907" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" fill="#5B5FA8">server/journal.js · EXCLUSIVE</text>
<text x="76" y="950" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#2E2A44">煎炒煮炸分得清楚</text>
<text x="76" y="984" font-size="15" fill="#5E5873">辨識寫出烹調方式與油量，查詢也須相符；</text>
<text x="76" y="1008" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#5B5FA8">炸≠蒸 · 生≠熟 · 無糖≠含糖</text>
<rect x="424" y="828" width="446" height="208" rx="20" fill="#FFFFFF" stroke="#E3DFD0"/>
