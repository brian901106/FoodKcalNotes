<text x="391" y="566" font-size="12" fill="#F0EFDB">呼叫模型</text>
<text x="80" y="566" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11" letter-spacing="1" fill="#999DCC">初次使用</text>
<text x="650" y="566" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11" letter-spacing="1" fill="#999DCC" text-anchor="end">持續記錄 →</text>
<rect x="706" y="196" width="446" height="184" rx="20" fill="#FFFFFF" stroke="#E3DFD0"/>
<text x="734" y="240" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" letter-spacing="1" fill="#5E5873"><tspan fill="#5B5FA8" font-weight="700">02</tspan><tspan dx="10">—</tspan><tspan dx="10">開源 · MIT</tspan></text>
<g transform="translate(1100 224)" fill="none" stroke="#5B5FA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></g>
<text x="734" y="294" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#2E2A44">框架免費開源，接入自己的 AI</text>
<text x="734" y="328" font-size="15" fill="#5E5873">用自己的 ChatGPT 帳號登入，或填 Claude API key；</text>
<text x="734" y="352" font-size="15" fill="#5E5873">兩者可依序備援，AI 用量計入你自己的方案。</text>
<rect x="706" y="404" width="446" height="184" rx="20" fill="#FFFFFF" stroke="#E3DFD0"/>
<text x="734" y="448" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" letter-spacing="1" fill="#5E5873"><tspan fill="#5B5FA8" font-weight="700">03</tspan><tspan dx="10">—</tspan><tspan dx="10">連勝・目標</tspan></text>
<g transform="translate(1100 432)" fill="none" stroke="#5B5FA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c.5 3 5 5.5 5 10.5a5 5 0 0 1-10 0c0-2.2 1-3.8 2.2-4.8.2 1.8 1 2.8 2 3 0-3-.6-5.6.8-8.7z"/></g>
<text x="734" y="566" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#5B5FA8">TDEE = (10×體重 + 6.25×身高 − 5×年齡 + 5／−161) × 活動係數</text>
<text x="734" y="490" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#2E2A44">連勝與減重目標</text>
<text x="734" y="520" font-size="15" fill="#5E5873">設定每日熱量目標與減重計劃，自動推估達成日；</text>
<text x="734" y="542" font-size="15" fill="#5E5873">每天有記錄且不超標，就累積連勝天數。</text>
<rect x="48" y="612" width="352" height="192" rx="20" fill="#FFFFFF" stroke="#E3DFD0"/>
<text x="76" y="656" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" letter-spacing="1" fill="#5E5873"><tspan fill="#5B5FA8" font-weight="700">04</tspan><tspan dx="10">—</tspan><tspan dx="10">份量估算</tspan></text>
<g transform="translate(348 640)" fill="none" stroke="#5B5FA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16.5L16.5 3 21 7.5 7.5 21z"/><path d="M7 12.5l2 2M10 9.5l2 2M13 6.5l2 2"/></g>
<text x="76" y="718" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#2E2A44">份量估得有依據</text>
<text x="76" y="752" font-size="15" fill="#5E5873">以筷子、飯碗、手機的比例估重量；</text>
<text x="76" y="776" font-size="15" fill="#5E5873">依身高推算拳頭，「飯一拳頭」也能換算。</text>
<rect x="424" y="612" width="352" height="192" rx="20" fill="#FFFFFF" stroke="#E3DFD0"/>
<text x="452" y="656" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" letter-spacing="1" fill="#5E5873"><tspan fill="#5B5FA8" font-weight="700">05</tspan><tspan dx="10">—</tspan><tspan dx="10">營養標示</tspan></text>
<g transform="translate(724 640)" fill="none" stroke="#5B5FA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></g>
<text x="452" y="718" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#2E2A44">拍包裝標示更準</text>
<text x="452" y="752" font-size="15" fill="#5E5873">營養標示清楚可讀時，</text>
<text x="452" y="776" font-size="15" fill="#5E5873">直接依標示換算，不必另外查資料。</text>
<rect x="800" y="612" width="352" height="192" rx="20" fill="#FFFFFF" stroke="#E3DFD0"/>
<text x="828" y="656" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" letter-spacing="1" fill="#5E5873"><tspan fill="#5B5FA8" font-weight="700">06</tspan><tspan dx="10">—</tspan><tspan dx="10">背景分析</tspan></text>
<g transform="translate(1100 640)" fill="none" stroke="#5B5FA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M9.5 12l2 2 3.5-3.5"/></g>
<text x="828" y="718" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#2E2A44">拍完就能關 app</text>
<text x="828" y="752" font-size="15" fill="#5E5873">分析在背景執行，完成後自動存成餐點，</text>
<text x="828" y="776" font-size="15" fill="#5E5873">之後再慢慢修改。</text>
