<text x="650" y="244" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#999DCC" text-anchor="end">MORE ACCURATE · FEWER CALLS</text>
<text x="80" y="314" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#F0EFDB">越用越準、越用越省</text>
<text x="80" y="352" font-size="17" fill="#C9C5D9">查過的資料與包裝標示，存餐點時自動收進本機食物庫；</text>
<text x="80" y="378" font-size="17" fill="#C9C5D9">下次記同樣的食物直接命中，不再呼叫模型。</text>
